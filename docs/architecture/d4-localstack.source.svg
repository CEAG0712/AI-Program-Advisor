  <title id="diagram-title">P3 Day 4 LocalStack infrastructure lifecycle</title>
  <desc id="diagram-description">A local Docker Terraform runner used the EC2 loopback endpoint of LocalStack Community 4.14.0. It created and inspected VPC 10.31.0.0/16 and its application subnet 10.31.0.0/24 in us-east-1a, then destroyed both. Terraform state ended with zero managed resources. No real AWS deployment occurred.</desc>
  <metadata>AWS architecture artwork from the July 31, 2026 icon package at https://aws.amazon.com/architecture/icons/. The Client and Virtual private cloud group icons retain their original vector artwork.</metadata>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8">
      <path d="M0 0l8 4-8 4z" fill="#655a79"/>
    </marker>
    <style>
