      .heading { font-size: 32px; font-weight: 700; }
      .section { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .detail { font-size: 14px; fill: #49445e; }
      .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 14px; fill: #49445e; }
      .arrow { fill: none; stroke: #655a79; stroke-width: 1.7; marker-end: url(#arrowhead); }
    </style>
  </defs>
